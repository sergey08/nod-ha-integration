name: Tag Lenovo manifest test
on:
  push:
    branches: [test/prepare-lenovo-b11]
    paths: [.github/workflows/tag-lenovo-test.yml]
permissions:
  contents: write
jobs:
  tag:
    if: github.repository == 'sergey08/nod-ha-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Tag the checked integration commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST --field ref=refs/tags/v0.1.0b11 --field sha=ae131c5d173adc59edf852b7618d2d3dea5e90a2
