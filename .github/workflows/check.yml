name: Check integration
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install aiohasupervisor==0.6.0 ruff==0.11.13
      - run: python -m compileall -q custom_components
      - run: python -m unittest discover -s tests

      - name: Check for undefined Python names
        run: python -m ruff check --select F821 custom_components tests
