name: Check integration
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.13'
            supervisor-client: '0.6.0'
          - python: '3.14'
            supervisor-client: '0.8.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install aiohasupervisor==${{ matrix.supervisor-client }} ruff==0.11.13
      - run: python -m compileall -q custom_components
      - run: python -m unittest discover -s tests

      - name: Check for undefined Python names
        run: python -m ruff check --select F821 custom_components tests
